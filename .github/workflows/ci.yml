name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test --if-present

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # NEXT_PUBLIC_* values are public (the Supabase anon key ships in the browser
    # bundle); they are inlined here only so the production build can complete.
    env:
      NEXT_PUBLIC_API_URL: https://orgbrain-production.up.railway.app
      NEXT_PUBLIC_SUPABASE_URL: https://thmrzulqsahxzkvqqvxu.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRobXJ6dWxxc2FoeHprdnFxdnh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NzU4ODUsImV4cCI6MjA5NjM1MTg4NX0.XzNwYkWLNXWK4a529snNb70QZOfxXDckcVqeSo9nN1o
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
